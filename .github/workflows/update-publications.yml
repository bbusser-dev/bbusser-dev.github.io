name: Update publications from OpenAlex

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_publications.py"
      - ".github/workflows/update-publications.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-publications:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications from OpenAlex
        env:
          OPENALEX_ORCID: "0000-0002-9425-1577"
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_publications.py

      - name: Commit updates if needed
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- generated/publications.md data/openalex_publications.json)" ]; then
            echo "No publication changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/publications.md data/openalex_publications.json
          git commit -m "Update publications from OpenAlex"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Normalize News categories
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/normalize_news_categories.py

      - name: Setup Quarto
        if: steps.changes.outputs.changed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        if: steps.changes.outputs.changed == 'true'
        run: quarto render

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
